<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Labs at Yale</title>
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='styles.css') }}"
  />
</head>

<body>
  <header class="topbar">
    <div class="inner_topbar">
      <div class="logo">
        <a class="logotext" href="{{ url_for('index') }}">
          LabsAtYale
        </a>
      </div>

      <nav class="navigationBar">
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      </nav>
    </div>
  </header>

  <div class="container login-card">
    <h2 class="login-header">Change Password</h2>

      {% if msg %}
      <p class="error-message">{{ msg }}</p>
    {% endif %}

    <form method="post">

      <div class="form-row">
        <label for="old_password">Old Password:</label>
        <input
          type="password"
          id="old_password"
          name="old_password"
          required
        />
      </div>

      <div class="form-row">
        <label for="new_password">New Password:</label>
        <input
          type="password"
          id="new_password"
          name="new_password"
          required
        />
      </div>

      <div class="form-row">
        <label for="confirm_new_password">
          Confirm New Password:
        </label>
        <input
          type="password"
          id="confirm_new_password"
          name="confirm_new_password"
          required
        />
      </div>

      <div class="submit-button">
        <button type="submit" class="btn-primary">
          Update Password
        </button>
      </div>

    </form>
  </div>
</body>
</html>
