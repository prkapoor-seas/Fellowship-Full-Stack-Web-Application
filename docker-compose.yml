# Local two-service dev setup. Each service builds from its own folder.
# Orchestration (Swarm) and canary come later; this just runs the split as two
# separate containers that talk over HTTP.
#
#   docker compose up --build      # web on http://localhost:8080
#                                  # analytics dashboard on http://localhost:8000
#
# APP_SECRET_KEY / SMTP_* are read from the repo .env file automatically.
name: labsatyale

services:
  analytics:
    build: ./analytics
    ports:
      - "8000:8000"          # exposed for inspection; the web app uses the internal network
    environment:
      AB_DB_PATH: /data/ab_events.sqlite
    volumes:
      - analytics-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./web
    ports:
      - "8080:8080"
    environment:
      ANALYTICS_URL: http://analytics:8000
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./labsatyale.sqlite:/app/labsatyale.sqlite
    depends_on:
      analytics:
        condition: service_healthy

volumes:
  analytics-data:
